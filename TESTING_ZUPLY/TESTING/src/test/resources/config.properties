base.url=https://zuply-ja0q.onrender.com/
api.base.path=/api

# Admin (pre-existing account)
admin.email=admin@zuply.in
admin.password=Admin@123

# Buyer & Seller bootstrap. Tests register a fresh account at suite start,
# so the email is auto-suffixed with a UUID and only the password/role/name
# below are needed. Set <role>.bootstrap=false to skip registration and
# log in with a static <role>.email instead.
buyer.bootstrap=true
buyer.password=Test@1234
buyer.role=CUSTOMER
buyer.name=Test Buyer
buyer.phone=9876543210

seller.bootstrap=true
seller.password=Test@1234
seller.role=SELLER
seller.name=Test Seller
seller.phone=9876543210

# Timeouts (ms)
http.connect.timeout=90000
http.read.timeout=30000

# Reporting
report.path=reports/ExtentReport.html
log.requests=true

# Retry
retry.count=1

env=prod
